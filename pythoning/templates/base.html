<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App{% endblock %}</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Hero Section */
.hero-section {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(135deg, #1a1a1a, #333333);
    color: #ffffff;
    text-align: center;
    flex-direction: column;
    padding: 20px;
}

.hero-section h1 {
    font-size: 3.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #ffffff;
}

.hero-section p {
    font-size: 1.25rem;
    margin-bottom: 2rem;
    color: #cccccc;
}

/* Button Styling */
.btn-primary {
    background-color: #ffffff;
    color: #333333;
    border: 2px solid #ffffff;
    padding: 12px 24px;
    font-size: 1.1rem;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
}

.btn-primary:hover {
    background-color: transparent;
    color: #ffffff;
    border-color: #ffffff;
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .hero-section h1 {
        font-size: 2.5rem;
    }

    .hero-section p {
        font-size: 1rem;
    }

    .btn-primary {
        padding: 10px 20px;
        font-size: 1rem;
    }
}

    </style>
</head>
<body>
    <header>
        <div class="hero-section">
            <div class="hero-content">
                <h1>Welcome to the Flask App!</h1>
                <p>Your gateways to seamless and efficient management.</p>
                <a href="{{ url_for('login') }}" class="btn-primary">Login</a>
            </div>
        </div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            {% if 'user_id' in session %}
                <a href="{{ url_for('logout') }}">Logout</a>
            <!--{% else %}
                <a href="{{ url_for('login') }}">Login</a>-->
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2024 My Flask App</p>
    </footer>
</body>
</html>

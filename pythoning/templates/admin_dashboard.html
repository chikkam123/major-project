<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        /* General Styles */
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    background: #ffffff;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
}

/* Form Section */
.form-section {
    flex: 1;
    padding: 20px;
    border-right: 1px solid #e0e0e0;
}

.form-section h2 {
    font-size: 24px;
    margin-bottom: 10px;
    color: #333;
}

.form-section form {
    display: flex;
    flex-direction: column;
}

.form-section label {
    font-weight: bold;
    margin-top: 10px;
    color: #555;
}

.form-section input, 
.form-section select {
    padding: 10px;
    margin-top: 5px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.form-section button {
    margin-top: 20px;
    padding: 10px;
    background-color: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

.form-section button:hover {
    background-color: #45a049;
}

/* Users Section */
.users-section {
    flex: 1;
    padding: 20px;
}

.users-section h2 {
    font-size: 24px;
    margin-bottom: 10px;
    color: #333;
}

.users-section ul {
    list-style: none;
    padding: 0;
}

.users-section li {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 5px;
    border-radius: 5px;
    color: #333;
}

/* Logout Button */
.logout-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #f44336;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    width: 100px;
    margin-left: auto;
    margin-right: auto;
    transition: background-color 0.3s ease;
}

.logout-btn:hover {
    background-color: #d73833;
}

/* Responsive Layout */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .form-section {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <h2>Add New User</h2>
            <form action="{{ url_for('add_user') }}" method="POST">
                <label for="username">Username:</label>
                <input type="text" name="username" required>

                <label for="email">Email:</label>
                <input type="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" name="password" required>

                <label for="role">Role:</label>
                <select name="role">
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>

                <button type="submit">Add User</button>
            </form>
        </div>

        <div class="users-section">
            <h2>All Users</h2>
            <ul>
                {% for user in users %}
                    <li>{{ user.username }} - {{ user.role }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <a class="logout-btn" href="/logout">Logout</a>
</body>
</html>

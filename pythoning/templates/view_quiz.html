<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .quiz-section {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h3 {
            margin-bottom: 10px;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 5px;
        }
        form {
            margin-top: 20px;
        }
        .question {
            margin-bottom: 20px;
        }
        label {
            font-size: 16px;
            margin-right: 10px;
        }
        .btn-submit {
            padding: 8px 12px;
            background-color: #007BFF;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Quiz Details -->
        <header class="header-section">
            <h2>{{ quiz.title }}</h2>
            <p>{{ quiz.description }}</p>
        </header>

        <!-- Questions Section -->
        <section class="quiz-section">
            <h3>Questions</h3>
            <form action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}" method="POST">
                {% for question in quiz.questions %}
                    <div class="question">
                        <label>{{ question.text }}</label><br>
                        {% for answer in question.answers %}
                            <input type="radio" id="q{{ question.id }}a{{ answer.id }}" name="question_{{ question.id }}" value="{{ answer.id }}">
                            <label for="q{{ question.id }}a{{ answer.id }}">{{ answer.text }}</label><br>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-submit">Submit Quiz</button>
            </form>
        </section>
    </div>
</body>
</html>

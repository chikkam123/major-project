<!DOCTYPE html>
<html>
<head>
    <title>Available Courses</title>
</head>
<body>
    <h1>Available Courses</h1>
    <ul>
        {% for course in courses %}
        <li>
            <h3>{{ course.name }}</h3>
            <p>{{ course.description }}</p>
            <a href="{{ url_for('enroll_course', course_id=course.id) }}">Enroll</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center text-primary">Add Question to Quiz: <span class="text-dark">{{ quiz.title }}</span></h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="text" class="form-label">Question Text</label>
                    <textarea class="form-control" name="text" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Options</label>
                    <input type="text" class="form-control mb-2" name="option_a" placeholder="Option A" required>
                    <input type="text" class="form-control mb-2" name="option_b" placeholder="Option B" required>
                    <input type="text" class="form-control mb-2" name="option_c" placeholder="Option C" required>
                    <input type="text" class="form-control mb-2" name="option_d" placeholder="Option D" required>
                </div>

                <div class="mb-3">
                    <label for="correct_option" class="form-label">Correct Option (A, B, C, or D)</label>
                    <input type="text" class="form-control" name="correct_option" maxlength="1" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Add Question</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('view_quiz', quiz_id=quiz.id) }}" class="btn btn-outline-secondary">Back to Quiz</a>
            </div>
        </div>
    </div>

</body>
</html>

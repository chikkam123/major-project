<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Score</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">🎯 Quiz Score</h2>
            
            <div class="mb-3">
                <p><strong>Quiz Title:</strong> {{ attempt.quiz.title }}</p>
                <p><strong>Student:</strong> {{ attempt.student.username }}</p>
                <p><strong>Score:</strong> <span class="text-success fw-bold">{{ attempt.score }}%</span></p>
            </div>

            <div class="text-center">
                <a href="{{ url_for('student_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
            </div>
        </div>
    </div>

</body>
</html>
